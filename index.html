<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كتاب قانون الأعمال: إنهاء عقد العمل بإرادة أحد طرفيه أو كليهما</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload Qomra & Al Jazeera Kurdish Fonts -->
    <link rel="preload" href="/fonts/QOMRAARABICITF-MEDIUM.OTF" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/QOMRAARABICITF-REGULAR.OTF" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/QOMRAARABICITF-BOLD.OTF" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/al-jazeera-kurdish.ttf" as="font" type="font/ttf" crossorigin />

    <!-- Authentic Royal Arabic Calligraphy Fonts (Katibeh Thuluth, Amiri, Amiri Quran, Aref Ruqaa, Reem Kufi) & Qomra/Alexandria/Noto body fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Aref+Ruqaa+Ink:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Katibeh&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Reem+Kufi:wght@500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'Qomra';
        src: local('Qomra'), local('Alexandria'), local('Tajawal');
        font-display: swap;
      }
      @font-face {
        font-family: 'Thuluth';
        src: local('DecoType Thuluth'), local('Aldhabi'), local('Katibeh');
        font-display: swap;
      }
      @font-face {
        font-family: 'AlJazeera';
        src: url('/fonts/al-jazeera-kurdish.ttf') format('truetype'),
             url('/fonts/al-jazeera-arabic.woff2') format('woff2'),
             url('/fonts/al-jazeera-arabic.ttf') format('truetype'),
             local('Nizar Jazeera'),
             local('Al-Jazeera-Arabic'),
             local('AlJazeera');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'AlJazeera';
        src: url('/fonts/al-jazeera-kurdish.ttf') format('truetype'),
             url('/fonts/al-jazeera-arabic.woff2') format('woff2'),
             url('/fonts/al-jazeera-arabic.ttf') format('truetype'),
             local('Nizar Jazeera'),
             local('Al-Jazeera-Arabic-Bold'),
             local('AlJazeera');
        font-weight: bold;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
